services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Our own upstream (services/upstream), a drop-in for test/fake-upstream.ts on :3001.
  # Opt in: docker compose --profile upstream up -d upstream
  upstream:
    profiles: [upstream]
    build: services/upstream
    environment:
      UPSTREAM_TOKEN: ${UPSTREAM_TOKEN:-dev-upstream-token}
      STATIC_PARAM: ${STATIC_PARAM:-}
    ports:
      - "127.0.0.1:3001:8000"
    volumes:
      # Captured OF sessions and proxy credentials: `docker compose down -v` deletes them.
      - upstream-data:/data

volumes:
  pgdata:
  upstream-data:
