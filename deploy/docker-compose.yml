# Production stack: cd deploy && cp .env.example .env && <edit .env> && docker compose up -d
# Only caddy publishes host ports (or nothing at all in tunnel mode); gateway, upstream and postgres stay internal.
# Secrets are listed per service on purpose (no env_file), so POSTGRES_PASSWORD, BETTER_AUTH_SECRET and
# TUNNEL_TOKEN only reach the services that need them.

# Not "gateway": a checkout in /opt/gateway gives the root dev compose that project name.
name: gateway-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: gateway:local
    expose: ["4000"]
    # Lets UPSTREAM_URL=http://host.docker.internal:<port> reach an upstream outside this compose project.
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      # One proxy hop in front (caddy, or cloudflared in tunnel mode).
      TRUST_PROXY: "1"
      # The password stays out of the URL, where / # % @ would break parsing; node-postgres reads PGPASSWORD.
      DATABASE_URL: postgres://gateway@postgres:5432/gateway
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      # The dashboard and the API share one origin.
      APP_URL: ${PUBLIC_URL:?}
      BETTER_AUTH_URL: ${PUBLIC_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      UPSTREAM_URL: ${UPSTREAM_URL:?}
      UPSTREAM_TOKEN: ${UPSTREAM_TOKEN:?}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-30000}
      # Empty = no event source: no webhooks from upstream events, and /v1/ws answers 503.
      UPSTREAM_WS_URL: ${UPSTREAM_WS_URL:-}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-365}
      # Sign-up verification mail. Empty SMTP_HOST = the link is printed in this service's log instead.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      # Only when the upstream profile is active; an upstream elsewhere is not waited for.
      upstream:
        condition: service_healthy
        required: false
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-boot setup the socket answers before Postgres listens on the network.
      test: ["CMD-SHELL", "pg_isready -U gateway -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  # COMPOSE_PROFILES=...,upstream: the OF upstream from services/upstream. Never published; the gateway
  # reaches it as http://upstream:8000. Its env is listed here alone: no Postgres or auth secrets.
  upstream:
    build:
      context: ../services/upstream
    image: gateway-upstream:local
    profiles: [upstream]
    expose: ["8000"]
    environment:
      UPSTREAM_TOKEN: ${UPSTREAM_TOKEN:?}
      UPSTREAM_STATE_DIR: /data
      OF_REQUIRE_PROXY: ${OF_REQUIRE_PROXY:-false}
      STATIC_PARAM: ${STATIC_PARAM:-}
      SENT_POLL_INTERVAL_S: ${SENT_POLL_INTERVAL_S:-120}
      MASS_POLL_INTERVAL_S: ${MASS_POLL_INTERVAL_S:-120}
    # Sessions (cookies) and proxies.json (proxy passwords): credentials. Back up encrypted.
    volumes:
      - upstream_data:/data
    restart: unless-stopped
    logging: *logging

  # COMPOSE_PROFILES=caddy (default): TLS on one domain, the only published ports.
  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # COMPOSE_PROFILES=tunnel: Cloudflare terminates TLS; no host port is published.
  # Point the tunnel's public hostname at http://gateway:4000.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    # Not ${TUNNEL_TOKEN:?}: compose interpolates every service, including ones outside the
    # active profile, so a required marker here would break plain `caddy` deployments.
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  upstream_data:
  caddy_data:
  caddy_config:
