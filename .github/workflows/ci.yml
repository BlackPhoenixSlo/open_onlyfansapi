name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U gateway"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gateway:gateway@localhost:5434/gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: migrations in sync with the schema
        run: pnpm db:generate && test -z "$(git status --porcelain apps/api/drizzle)"
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: sh scripts/check-secrets.sh --all

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: image builds
        run: docker build -f apps/api/Dockerfile -t gateway:ci .
      - name: production stack boots and answers through caddy
        run: sh scripts/compose-smoke.sh

  upstream:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/upstream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/upstream/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff (lifted modules held to F,E9; service code to ruff defaults)
        run: |
          ruff check --select F,E9 .
          ruff check app.py pump.py events.py connect.py tests
      - run: pytest -q
      - name: image builds
        run: docker build -t gateway-upstream:ci .
