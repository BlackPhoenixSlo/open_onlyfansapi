name: Bug report
description: Something in Gateway does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues: do not open an issue, follow SECURITY.md instead.
        Do not paste API keys, tokens, webhook secrets or session cookies.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.0.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How you run it
      options:
        - docker compose (deploy/)
        - local dev (pnpm dev)
        - other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Redact anything secret.
      render: text
